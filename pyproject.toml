[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchslim"
version = "0.6.3"
description = "Drop-in reducer for Grep/Glob/rg/fd and test/build output: fewer tokens, same evidence."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
claude = ["anthropic"]

[project.scripts]
searchslim = "searchslim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
